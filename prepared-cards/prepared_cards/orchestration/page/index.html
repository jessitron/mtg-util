<!doctype html>
<meta charset="utf-8">
<title>Prepared cards</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #1b1b1f; color: #eee; }
  header { position: sticky; top: 0; background: #111; padding: .6rem 1rem; display: flex; gap: 1rem; align-items: center; z-index: 1; }
  button { font-size: 1rem; padding: .4rem .8rem; }
  h2 { margin: 1.2rem 1rem .4rem; }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; padding: 0 1rem; }
  label.card { width: 244px; cursor: pointer; border: 3px solid transparent; border-radius: 12px; padding: 2px; }
  label.card img { width: 100%; border-radius: 10px; display: block; }
  label.card.picked { border-color: #4ade80; }
  label.card input { display: block; width: 24px; height: 24px; margin: 0 0 4px 4px; }
  .noimg { height: 340px; display: flex; align-items: center; justify-content: center; background: #333; border-radius: 10px; }
</style>
<header>
  <strong id="count"></strong>
  <button id="copy">Copy selection to clipboard</button>
  <span id="status"></span>
</header>
<main id="main"></main>
<script>
const picked = new Set();
const $ = id => document.getElementById(id);
const show = () => $("count").textContent = `${picked.size} selected`;

function cardView(card) {
  const label = document.createElement("label");
  label.className = "card";
  label.title = card.name;
  if (card.imageUrl) {
    const img = document.createElement("img");
    img.loading = "lazy";
    img.src = card.imageUrl;
    img.alt = card.name;
    label.append(img);
  } else {
    const placeholder = document.createElement("div");
    placeholder.className = "noimg";
    placeholder.textContent = card.name;
    label.append(placeholder);
  }
  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = picked.has(card.name);
  label.classList.toggle("picked", box.checked);
  box.onchange = () => {
    box.checked ? picked.add(card.name) : picked.delete(card.name);
    label.classList.toggle("picked", box.checked);
    show();
  };
  label.prepend(box);
  return label;
}

async function init() {
  const [pool, saved] = await Promise.all([
    fetch("/api/cards").then(r => r.json()),
    fetch("/api/selection").then(r => r.json()),
  ]);
  saved.forEach(name => picked.add(name));
  document.title = pool.title;
  for (const group of pool.groups) {
    const heading = document.createElement("h2");
    heading.textContent = group.label;
    const row = document.createElement("div");
    row.className = "row";
    row.append(...group.cards.map(cardView));
    $("main").append(heading, row);
  }
  show();
}

async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const area = document.createElement("textarea");  // fallback for non-secure origins
  area.value = text;
  document.body.append(area);
  area.select();
  const ok = document.execCommand("copy");
  area.remove();
  if (!ok) throw new Error("copy was blocked");
}

$("copy").onclick = async () => {
  const names = [...picked];
  const text = names.map(name => `1 ${name}`).join("\n") + "\n";  // Archidekt import format
  try {
    await copyText(text);
    $("status").textContent = `Copied ${names.length} cards. Paste into Archidekt's import box.`;
  } catch (e) {
    $("status").textContent = `Copy failed: ${e.message}`;
  }
  fetch("/api/selection", {method: "POST", body: JSON.stringify(names)});  // remember picks across reloads
};
init();
</script>
