<!doctype html>
<meta charset="utf-8">
<title>Prepared cards</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #1b1b1f; color: #eee; }
  header { position: sticky; top: 0; background: #111; padding: .6rem 1rem; display: flex; gap: 1rem; align-items: center; z-index: 1; }
  button { font-size: 1rem; padding: .4rem .8rem; }
  .row { display: flex; flex-wrap: wrap; gap: .6rem; padding: 1rem; }
  label.card { width: 244px; border: 3px solid transparent; border-radius: 12px; padding: 2px; }
  label.card a { display: block; }
  label.card img { width: 100%; border-radius: 10px; display: block; }
  label.card.picked { border-color: #4ade80; }
  label.card .top { display: flex; align-items: center; justify-content: space-between; margin: 0 4px 4px; }
  label.card input { display: block; width: 24px; height: 24px; margin: 0; }
  label.card .score { font-variant-numeric: tabular-nums; color: #bbb; }
  label.card .bar { height: 4px; margin: 0 4px 4px; border-radius: 2px; background: linear-gradient(to right, #8ab4ff var(--fill), #333 var(--fill)); }
  .noimg { height: 340px; display: flex; align-items: center; justify-content: center; background: #333; border-radius: 10px; }
</style>
<header>
  <strong id="count"></strong>
  <button id="copy">Copy selection to clipboard</button>
  <span id="status"></span>
  <span id="ranking"></span>
</header>
<main id="main"></main>
<script>
const picked = new Set();
const $ = id => document.getElementById(id);
const show = () => $("count").textContent = `${picked.size} selected`;

function cardView(card) {
  const label = document.createElement("label");
  label.className = "card";
  label.title = card.name;
  const link = document.createElement("a");  // clicking the card opens Gatherer; the checkbox does the picking
  link.href = card.gathererUrl;
  link.target = "_blank";
  link.rel = "noopener";
  if (card.imageUrl) {
    const img = document.createElement("img");
    img.loading = "lazy";
    img.src = card.imageUrl;
    img.alt = card.name;
    link.append(img);
  } else {
    const placeholder = document.createElement("div");
    placeholder.className = "noimg";
    placeholder.textContent = card.name;
    link.append(placeholder);
  }
  label.append(link);
  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = picked.has(card.name);
  label.classList.toggle("picked", box.checked);
  box.onchange = () => {
    box.checked ? picked.add(card.name) : picked.delete(card.name);
    label.classList.toggle("picked", box.checked);
    show();
  };
  const score = document.createElement("span");
  score.className = "score";
  score.textContent = card.score.toFixed(2);
  const bar = document.createElement("div");  // a 0-2 bar, so the order reads at a glance
  bar.className = "bar";
  bar.style.setProperty("--fill", `${card.score / 2 * 100}%`);
  const top = document.createElement("div");
  top.className = "top";
  top.append(box, score);
  label.prepend(top, bar);
  return label;
}

async function init() {
  const [pool, saved] = await Promise.all([
    fetch("/api/cards").then(r => r.json()),
    fetch("/api/selection").then(r => r.json()),
  ]);
  saved.forEach(name => picked.add(name));
  document.title = pool.title;
  if (pool.effort) {  // what scoring took when the scores were made, remembered across restarts
    const {scorer, seconds, costUsd} = pool.effort;
    $("ranking").textContent = `Ranked by ${scorer} in ${seconds.toFixed(1)} seconds for ${costUsd === null ? "an unknown cost" : "$" + Number(costUsd.toPrecision(2))}`;  // two significant digits: $0.0015 for Jev, $0.031 for Haiku
  }
  const row = document.createElement("div");  // the server sends them most powerful first
  row.className = "row";
  row.append(...pool.cards.map(cardView));
  $("main").append(row);
  show();
}

$("copy").onclick = async () => {
  if (!window.isSecureContext) return alert("Clipboard needs https or localhost.");
  // The server saves the picks and formats them. Handing the clipboard a promise keeps the click's permission while we wait.
  const saved = fetch("/api/selection", {method: "POST", body: JSON.stringify([...picked])}).then(r => r.json());
  const text = saved.then(r => new Blob([r.text], {type: "text/plain"}));
  try {
    await navigator.clipboard.write([new ClipboardItem({"text/plain": text})]);
    $("status").textContent = `Copied ${(await saved).saved} cards. Paste into Archidekt's import box.`;
  } catch (e) {
    $("status").textContent = `Copy failed: ${e.message}`;
  }
};
init();
</script>
